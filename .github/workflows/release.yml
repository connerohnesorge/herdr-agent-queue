name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest -v
      - name: Tag matches manifest version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("herdr-plugin.toml", "rb"))["version"])')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "manifest version $version does not match tag $GITHUB_REF_NAME"; exit 1; }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Install: \`herdr plugin install ${{ github.repository }} --ref $GITHUB_REF_NAME\`"
